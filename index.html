<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Creator Studio — Remote Gateway</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --subtext: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 75%);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      font-size: 0.825rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }
    p.desc {
      color: var(--subtext);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
    }
    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .info-box {
      margin-top: 1.75rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      text-align: left;
      font-size: 0.85rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0;
    }
    .info-label { color: var(--subtext); }
    .info-val {
      font-family: monospace;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 0.35rem;
      user-select: all;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--subtext);
    }
  </style>
  <script>
    // Automatic redirection
    setTimeout(function() {

    }, 1200);
  </script>
</head>

    <a href="https://telecom-nine-veterans-luis.trycloudflare.com" class="btn" id="open-btn">
      Open Workspace Now &rarr;
    </a>

    <div class="info-box">
      <div class="info-row">
        <span class="info-label">Workspace Password:</span>
        <span class="info-val">Ged__dzQdguw26Z5</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Boot Sync:</span>
        <span class="info-val" style="font-size:0.75rem;">2026-09-20 11:31:07 UTC</span>
      </div>
    </div>

    <div class="footer">

</body>
</html>
